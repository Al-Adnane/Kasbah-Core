apiVersion: v1
kind: Service
metadata:
  name: kasbah-api
  namespace: kasbah
spec:
  selector:
    app: kasbah-api
  ports:
    - name: http
      port: 80
      targetPort: 8788
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kasbah-api
  namespace: kasbah
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kasbah-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
