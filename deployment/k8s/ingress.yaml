apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kasbah-api
  namespace: kasbah
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: kasbah-api.example.com  # <-- change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kasbah-api
                port:
                  number: 80
