apiVersion: v1
kind: ServiceAccount
metadata:
  name: kasbah-api
  namespace: kasbah
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kasbah-api
  namespace: kasbah
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kasbah-api
  namespace: kasbah
subjects:
  - kind: ServiceAccount
    name: kasbah-api
    namespace: kasbah
roleRef:
  kind: Role
  name: kasbah-api
  apiGroup: rbac.authorization.k8s.io
